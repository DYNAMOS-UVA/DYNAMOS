# #83 (CN_C group, dsp-connector acting as Consumer, #79-#82's work).
#
# Real bugs found and fixed getting CN_C live at all:
#   1. negotiation-service's own route table panicked on startup (main.go) -
#      a genuine Go 1.22 ServeMux conflict between
#      /negotiations/consumer/{id} (#80) and three pre-existing
#      /negotiations/{id}/<verb> routes, never caught before because
#      nothing had exercised the real http.ListenAndServe wiring end-to-end
#      until this session's live run. Fixed by method-qualifying the
#      conflicting patterns.
#   2. #82's autoAcceptOffer/autoVerifyAgreement were synchronous, and a
#      synchronous outbound call back to the same Provider that just sent
#      the triggering Offer/Agreement deadlocked against the TCK's own
#      embedded server (bare EOF, no response) on every live attempt. Fixed
#      by running the outbound send + local transition in a goroutine
#      (auto_accept.go) - matches deliverToConsumer's own existing
#      fire-and-forget reasoning, and the DSP TCK's own client code never
#      reads these particular acks anyway.
#   3. A bare {"@id","target"} offer failed the TCK's own JSON-LD schema
#      validation ("required property 'permission'/'prohibition'/'@type'
#      not found", then "must have at least 1 items" once @type was added
#      but the arrays were left empty) - fixed by giving every offer this
#      harness builds a real @type and one trivial permission entry,
#      matching catalog.Offer's own real shape (pkg/catalog/types.go),
#      which already passes the CN group's own TCK validation.
#
# Confirmed live: CN_C:01-01 (full REQUESTED -> OFFERED -> ACCEPTED ->
# AGREED -> VERIFIED -> FINALIZED round trip, including the final GET
# status poll) SUCCESSFUL end to end, multiple times - real proof the whole
# Consumer-role stack (initiate handler, offer/agreement/events/termination
# callbacks, GET status endpoint, DAT-derived ownership checks) works
# against a real external Provider over real HTTP, not just fixtures.
#
# Architectural finding, escalated and resolved with the project owner
# rather than worked around solo (ADR-008's own escalation norm): several
# CN_C tests send DYNAMOS the exact same message (identical Offer/Agreement
# content across every test) and require opposite reactions - accept vs.
# counter-offer vs. terminate vs. do nothing. No deterministic always-on
# policy can satisfy that; nothing in the message itself says which test is
# running. Confirmed live, not just from source: CN_C:01-02 (needs a
# counter-offer) genuinely hung waiting for a state accept-all will never
# produce, and separately, our real ACCEPTED event landed on a TCK endpoint
# that test never registered a handler for (404).
#
# Resolved by CONSUMER_AUTO_NEGOTIATE=false (negotiation-service env var,
# main.go): turns #82's autonomous accept-all off entirely for this TCK
# run only (unset/true is still the real, unconditional demo behavior) -
# a Consumer-role negotiation then sits at OFFERED/AGREED until something
# explicitly drives it, the same "nothing happens on its own" model
# Provider-role has always had. tck_auto_responder_consumer.go (new, mirrors
# tck_auto_responder.go's own CN-group pattern) drives each test's real,
# different reaction externally instead, dispatched by dataset id (the
# CN_C_XX_DATASETID values below, echoed back to DYNAMOS in every
# Offer/Agreement's own "target" field). The 4 actions it calls
# (negotiation_consumer_manual_handler.go: accept/verify/counter/terminate)
# aren't TCK-only scaffolding - they're real internal-API surface a future
# decision policy (the standup-discussed consortiumAgreementId work) would
# need to call anyway; accept-all is just the one caller that exists today.
#
# Run tck_auto_responder_consumer.go alongside the other services, with
# negotiation-service started as CONSUMER_AUTO_NEGOTIATE=false, before
# run-tck.sh (tck_auto_responder.go, the CN-group one, still needs to run
# too - both watch overlapping etcd space but filter to their own known
# dataset-id namespaces, so running both together is safe and necessary
# since dsp-cn covers both groups in one suite).
#
# CONFIRMED LIVE: 31/31, zero failures - the full CN + CN_C combined run,
# no shortcuts, no isolated single-test runs. See last-run-cn.log for the
# raw TCK output. Both real bugs above and the consumerAutoNegotiate design
# were required to get here; CN's own 15/15 (T2.5's original baseline) is
# unaffected - confirmed in the same run, not assumed.
