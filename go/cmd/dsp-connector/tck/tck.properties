# T3.4 (#67): TP provider-group tests (dsp-connector acting as provider,
# the only role it implements - same as CN). Unlike CN, no per-test dataset
# or scripted response is needed: dsp-connector's provider endpoints
# already implement the transfer state machine the same way for every
# test, so every TP_XX_AGREEMENTID reuses the one FINALIZED negotiation
# seed_tp_negotiation.go seeds (run once before this TCK run, same as
# seed_cn_datasets.go). FORMAT is never validated by dsp-connector - it is
# opaque, carried straight through to the DSP TransferProcess ack - so one
# fixed value covers every test.
#
# Expected noise, verified against a live run (T3.4): only TP:03-01 and
# TP:03-02 pass against a real CUT over HTTP. The other 12 TP tests need
# the TCK itself to autonomously push Start/Complete/Terminate/Suspend
# into the CUT mid-test (ProviderActions, driven by
# transferProcessMock.recordTransferRequestedAction in the TCK's own
# source). That mechanism only runs when
# dataspacetck.dsp.local.connector=true - i.e. when the TCK tests itself,
# not a real external connector. With it false (required here - dsp-connector
# is a real HTTP service, not TCK's internal fake), DspSystemLauncher wires
# in NoOpProviderTransferProcessMock instead, whose recordTransferRequestedAction
# body is empty. Nothing ever POSTs the message these 12 tests wait on, so
# thenWaitForState(...) polls forever. Confirmed live: TP:03-03 sat over
# 20 minutes with zero requests reaching dsp-connector, TCK container CPU
# idle throughout.
#
# Making dsp-connector autonomously self-start a transfer with no job spec
# was tried as a fix. It flips the outcome instead of improving it: TP:03-01
# and TP:03-02 need the transfer to stay REQUESTED until a real message
# arrives, and a self-started transfer fails that immediately. The two
# request shapes are indistinguishable from the CUT's side (same format, no
# dataAddress, same everything) - no single provider policy satisfies both
# groups. Kept the current behavior: it preserves real protocol-safety
# compliance (correctly rejecting invalid transitions) over fabricating
# autonomous business logic DYNAMOS does not have for a job-less transfer.
# This is a TCK harness gap, not a dsp-connector one - same tier as CN_C/TP_C
# above. Worth reporting upstream to eclipse-dataspacetck/dsp-tck; not worth
# working around here.
TP_01_01_AGREEMENTID=urn:dynamos:negotiation:VU:tck-tp-fixture
TP_01_01_FORMAT=dynamos:sqlDataRequest
