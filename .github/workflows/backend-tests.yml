name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  synthetic-tests:
    name: Go build/vet/test
    runs-on: ubuntu-latest
    # Skip draft PRs - only push-to-main and non-draft PRs run this. A
    # draft turning into a real PR (ready_for_review, added to types above)
    # still gets a run.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      # cmd/archetype_playground/pseudocode.go is a pre-existing, tracked
      # file containing literal pseudocode, not valid Go (predates this
      # workflow, unrelated to DSP work) - `go list ./...` still finds it,
      # so every command below excludes it explicitly rather than silently
      # tripping on an unrelated package.
      - name: Build (default tags)
        run: go build $(go list ./... | grep -v archetype_playground)

      - name: Vet (default tags)
        run: go vet $(go list ./... | grep -v archetype_playground)

      # Two pre-existing, unrelated failures skipped here (confirmed via
      # git log to predate this workflow and #83's DSP work by years,
      # neither touches DSP code):
      #   - TestGetPrefixListEtcd (pkg/etcd) - a mock-vs-real type mismatch
      #     ([]TestType vs []*TestType), deterministic, always fails.
      #   - TestSliceIntersectAndDifference2 (pkg/lib) - asserts an exact
      #     slice order that depends on map iteration order, so it fails
      #     roughly half the time; skipped rather than left flaky-red.
      - name: Test (default tags)
        run: go test -skip 'TestGetPrefixListEtcd|TestSliceIntersectAndDifference2' $(go list ./... | grep -v archetype_playground)

      # -tags local is the real build variant catalog-service/negotiation-
      # service/dsp-connector run under in dev and in the DSP TCK workflow
      # (dsp-tck.yml) - scoped to just those three packages, since not
      # every service in this module supports -tags local (e.g.
      # api-gateway's config_local.go is missing grpcAddr, a separate
      # pre-existing gap, out of scope here).
      - name: Build (local tags, DSP services)
        run: go build -tags local ./cmd/dsp-connector/... ./cmd/negotiation-service/... ./cmd/catalog-service/...

      - name: Vet (local tags, DSP services)
        run: go vet -tags local ./cmd/dsp-connector/... ./cmd/negotiation-service/... ./cmd/catalog-service/...

      # TestDIDWebDocumentURL is a known, pre-existing, unrelated failure
      # under -tags local only (hardcodes an https expectation, ignores the
      # build-tag-driven didWebScheme=http) - confirmed via `git stash -u`
      # to predate the #83 DSP work, not fixed here per this repo's
      # established practice of not touching unrelated pre-existing issues.
      - name: Test (local tags, DSP services)
        run: go test -tags local -skip TestDIDWebDocumentURL ./cmd/dsp-connector/... ./cmd/negotiation-service/... ./cmd/catalog-service/...
