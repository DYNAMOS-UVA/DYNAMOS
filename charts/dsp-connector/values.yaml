Namespace: dsp-connector
branchNameTag: "main"
dockerArtifactAccount: "dynamos1"
catalogServiceURL:
  uva: "http://catalog-service-uva.catalog-service.svc.cluster.local:8080"
  vu: "http://catalog-service-vu.catalog-service.svc.cluster.local:8080"
  surf: "http://catalog-service-surf.catalog-service.svc.cluster.local:8080"
negotiationServiceURL:
  uva: "http://negotiation-service-uva.negotiation-service.svc.cluster.local:8080"
  vu: "http://negotiation-service-vu.negotiation-service.svc.cluster.local:8080"
  surf: "http://negotiation-service-surf.negotiation-service.svc.cluster.local:8080"
transferServiceURL:
  uva: "http://transfer-process-service-uva.transfer-process-service.svc.cluster.local:8080"
  vu: "http://transfer-process-service-vu.transfer-process-service.svc.cluster.local:8080"
  surf: "http://transfer-process-service-surf.transfer-process-service.svc.cluster.local:8080"

# Comma-separated DIDs that may call /negotiations/initiate and
# /transfers/initiate. These endpoints make DYNAMOS start a negotiation or
# a transfer under its own identity. Empty: both refuse every caller.
consumerInitiators: ""

# Authentication (see templates/_auth.tpl and scripts/auth-secrets.sh).
# Service tokens this connector sends to the internal APIs of the DSP
# services. transfer-process-service trusts dsp-connector.pub.pem.
auth:
  secretName: dynamos-auth
  env:
    TOKEN_ISSUER_PROVIDER: jwt
    TOKEN_ISSUER_JWT_ISSUER: dynamos-dsp-connector
    TOKEN_ISSUER_JWT_PRIVATE_KEY_FILE: /etc/dynamos/auth/dsp-connector.key.pem
