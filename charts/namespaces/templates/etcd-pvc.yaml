apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-pvc
  namespace: orchestrator
  annotations:
    "linkerd.io/inject" : disabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Mi
# configuration/fill-rabbit-pvc.sh fills this PVC with the local files in
# configuration/etcd_launch_files. An earlier "init-etcd-pvc" Job also
# downloaded these files from GitHub (branch main) into the same PVC. The
# result depended on which one ran last, and the Job failed with
# "Permission denied" when the files were already there. Thus the Job is
# removed and the local files are the only source.
