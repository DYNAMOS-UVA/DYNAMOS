Namespace: negotiation-service
etcdEndpoints: "http://etcd-0.etcd-headless.core.svc.cluster.local:2379,http://etcd-1.etcd-headless.core.svc.cluster.local:2379,http://etcd-2.etcd-headless.core.svc.cluster.local:2379"
branchNameTag: "main"
dockerArtifactAccount: "dynamos1"

# Authentication (see templates/_auth.tpl and scripts/auth-secrets.sh).
# Callers of the internal API (/internal/v1/negotiations/...):
#   - dsp-connector, with its service tokens (dsp-connector.pub.pem).
#   - Operators, who send the Provider-side offer, agreement and FINALIZED
#     steps. In production, add an identity provider to AUTH_PROVIDERS
#     (for example oidc) whose tokens carry the scope
#     negotiation-service:internal. Tilt turns on devToken.
# The service does not start without AUTH_PROVIDERS.
auth:
  secretName: dynamos-auth
  env:
    AUTH_PROVIDERS: jwt
    AUTH_JWT_ISSUER: dynamos-dsp-connector
    AUTH_JWT_AUDIENCE: negotiation-service
    AUTH_JWT_PUBLIC_KEY_FILES: /etc/dynamos/auth/dsp-connector.pub.pem
  devToken:
    enabled: false
    secretKey: dev-operator-token
    subject: dynamos-operator
    kind: service
    scopes: negotiation-service:internal
